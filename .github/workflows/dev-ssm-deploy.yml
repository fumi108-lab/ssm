name: dev-ssm-deploy

# command_documents/healthcheck 配下の JSON を dev 環境の SSM ドキュメントへ反映する。
#
# 実行方法:
#   Actions の Run workflow で「Use workflow from」に対象ブランチを選ぶ。入力欄は無い。
#   選んだブランチに紐づく base=dev の open PR を逆引きし、その差分だけを反映する。
#
# ジョブ構成 (この順に実行される):
#   validate   … PR の特定・JSON 検証・命名規則チェック。AWS には一切触れない
#   plan       … 読み取り専用ロールで AWS と差分を取り、反映予定を summary/artifact に出す
#   deploy-dev … Required reviewers の承認後、plan.tsv に従って反映する
#
# 承認ゲートは deploy-dev の environment (Development) にある。
# validate で落ちれば AWS 認証すら発生しないため、検証は可能な限り validate へ寄せる。
#
# 設計判断の経緯は README の Design Decisions を参照。

on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC で IAM Role を AssumeRole するために必要
  contents: read
  pull-requests: read # validate の gh pr list に必要。外すと対象 PR を特定できない

# 複数人が別々のドキュメントを同時に編集する運用を想定し、ブランチ (= PR) 単位で
# 並走させる。同一ブランチの重複実行だけを直列化して二重反映を防ぐ。
# 同じドキュメントが競合した場合は後にデプロイされた内容が有効になる (後勝ち)。
concurrency:
  group: dev-ssm-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NAME: dev
  AWS_REGION: ap-northeast-1
  DOC_DIR: command_documents/healthcheck
  # 対象とする PR の base ブランチ (スペース区切り)。
  # gh pr list --base は 1 値しか取れないため、取得後に絞り込む方式にしている
  BASE_BRANCHES: "dev"
  # 管理対象ファイルの拡張子。glob / pathspec / エラーメッセージで共有する
  DOC_EXT: json
  # SSM ドキュメント名の規約: <NAME>-<DOC_TYPE>-<任意>
  # IAM ポリシー (development-ssmPlan / development-ssmExec) の Resource が
  # arn:aws:ssm:<region>:<account>:document/dev-cmd-* に限定されているため、
  # ここを変更する場合は IAM 側の Resource も合わせて変更すること。
  DOC_TYPE: cmd
  PLAN_ARTIFACT_NAME: ssm-deploy-plan
  # JavaScript製 action を Node.js 24 で実行させるための環境変数。
  # 各 action が Node 24 に対応すれば削除できる暫定設定
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # 反映対象の特定と検証だけを行う。AWS 認証情報を持たないため、
  # ここで落とせば AWS には一切アクセスしない。検証はできる限りこのジョブへ寄せる。
  validate:
    runs-on: ubuntu-latest
    outputs:
      changed_count: ${{ steps.changed_files.outputs.changed_count }}
      targets_json: ${{ steps.changed_files.outputs.targets_json }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_title: ${{ steps.pr.outputs.pr_title }}
      pr_author: ${{ steps.pr.outputs.pr_author }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      # base ブランチとの merge-base 算出に履歴が要るため全履歴を取得する
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # PR 番号の打ち間違いを防ぐため、実行時に選択したブランチから
          # open PR を逆引きして対象を特定する。
          # gh pr list --base は 1 値しか受け付けないので、取得後に BASE_BRANCHES で絞る
          prs="$(gh pr list --head "$BRANCH" --state open \
            --json number,title,author,isDraft,headRefOid,baseRefName)"

          prs="$(printf '%s' "$prs" | jq -c --arg bases "$BASE_BRANCHES" '
            ($bases | split(" ")) as $allowed
            | [ .[] | select(.baseRefName as $b | $allowed | index($b)) ]
          ')"
          count="$(printf '%s' "$prs" | jq 'length')"

          if [ "$count" -eq 0 ]; then
            echo "Branch '${BRANCH}' has no open pull request based on: ${BASE_BRANCHES}." >&2
            echo "Select the branch of such an open PR in 'Use workflow from'." >&2
            exit 1
          fi

          if [ "$count" -gt 1 ]; then
            echo "Branch '${BRANCH}' has multiple open pull requests based on: ${BASE_BRANCHES}" >&2
            printf '%s' "$prs" | jq -r '.[] | "  #\(.number) -> \(.baseRefName)  \(.title)"' >&2
            echo "Cannot determine the deployment target." >&2
            exit 1
          fi

          pr_number="$(printf '%s' "$prs" | jq -r '.[0].number')"
          pr_title="$(printf '%s' "$prs" | jq -r '.[0].title')"
          pr_author="$(printf '%s' "$prs" | jq -r '.[0].author.login')"
          is_draft="$(printf '%s' "$prs" | jq -r '.[0].isDraft')"
          head_oid="$(printf '%s' "$prs" | jq -r '.[0].headRefOid')"
          base_ref="$(printf '%s' "$prs" | jq -r '.[0].baseRefName')"

          # 作業途中の PR は反映しない
          if [ "$is_draft" = "true" ]; then
            echo "PR #${pr_number} is a draft. Mark it ready for review before deploying." >&2
            exit 1
          fi

          # 実行開始後に push された場合など、認識と実体がズレた状態でのデプロイを防ぐ
          if [ "$head_oid" != "$RUN_SHA" ]; then
            echo "PR #${pr_number} head (${head_oid}) does not match the checked out commit (${RUN_SHA})." >&2
            echo "The branch was probably updated after this run started. Re-run the workflow." >&2
            exit 1
          fi

          echo "PR #${pr_number} ${pr_title} (@${pr_author})"
          echo "Branch: ${BRANCH} -> ${base_ref}  Commit: ${RUN_SHA}"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_title=$pr_title" >> "$GITHUB_OUTPUT"
          echo "pr_author=$pr_author" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: UTF-8 check
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 管理対象の JSON が UTF-8 として読めることを確認する
          for f in "${DOC_DIR}"/*.${DOC_EXT}; do
            iconv -f UTF-8 -t UTF-8 "$f" > /dev/null
          done

      - name: JSON parse check
        run: |
          set -euo pipefail
          shopt -s nullglob
          # すべての JSON が構文的に正しいことを確認する
          for f in "${DOC_DIR}"/*.${DOC_EXT}; do
            jq -e . "$f" > /dev/null
          done

      - name: Collect changed documents
        id: changed_files
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          # base ブランチが PR 作成後に進んでいても無関係な差分を拾わないよう merge-base を基準にする。
          # base は PR から導出しているので、main / master のどちらでもそのまま動く
          base_sha="$(git merge-base "origin/${BASE_REF}" HEAD)"

          mapfile -t changed_files < <(
            git diff --name-only "$base_sha" HEAD -- "${DOC_DIR}/*.${DOC_EXT}"
          )

          # SSM ドキュメント名の導出はここだけで行い、以降のジョブは targets_json を
          # そのまま使う。命名規則を変えるときに直すのはこの 1 箇所で済み、
          # validate でチェックした名前と実際にデプロイされる名前が必ず一致する。
          targets_json="$(
            printf '%s\n' "${changed_files[@]}" \
              | jq -R -s -c --arg env_name "$NAME" '
                  split("\n")
                  | map(select(length > 0))
                  | map({
                      file: .,
                      name: ($env_name + "-" + (. | split("/") | last | sub("\\.[^.]*$"; "")))
                    })
                '
          )"

          echo "changed_count=${#changed_files[@]}" >> "$GITHUB_OUTPUT"
          echo "targets_json=$targets_json" >> "$GITHUB_OUTPUT"

      - name: Check document naming convention
        env:
          TARGETS_JSON: ${{ steps.changed_files.outputs.targets_json }}
        run: |
          set -euo pipefail

          # 規約から外れた名前は plan の describe-document が IAM の Resource 条件に
          # 弾かれて AccessDenied になる。AWS に触る前のこの段階で、原因が分かる形で止める。
          # 既存ドキュメントには規約以前の名前が残っているため、対象は変更ファイルのみ。
          expected="^${NAME}-${DOC_TYPE}-[A-Za-z0-9._-]+$"
          invalid=0

          while IFS=$'\t' read -r file_path name; do
            [ -n "$file_path" ] || continue

            if printf '%s' "$name" | grep -Eq "$expected"; then
              echo "OK: $file_path -> $name"
              continue
            fi

            echo "::error file=${file_path}::SSM document name '${name}' does not match '${NAME}-${DOC_TYPE}-*'. Rename the file to '${DOC_TYPE}-<name>.${DOC_EXT}'."
            invalid=$((invalid + 1))
          done < <(printf '%s' "$TARGETS_JSON" | jq -r '.[] | "\(.file)\t\(.name)"')

          if [ "$invalid" -ne 0 ]; then
            echo "${invalid} document(s) violate the naming convention '${NAME}-${DOC_TYPE}-*'." >&2
            exit 1
          fi

  # 読み取り専用ロールで AWS 上の現在の内容と比較し、反映予定を承認者へ提示する。
  # ここでは書き込みを一切行わない。
  plan:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      # 保護ルール無し。読み取り専用の IAM Role を紐付けるためだけに指定している
      name: Development_ReadOnly
    outputs:
      actionable_count: ${{ steps.build_plan.outputs.actionable_count }}
    steps:
      # ref の指定は必須。省略すると github.ref ではなくデフォルトブランチの内容を
      # 反映してしまう。github.sha は run 全体で固定なので、承認待ちの間にブランチが
      # 進んでも plan と deploy-dev が同じコミットを見ることが保証される。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # __ENV__ プレースホルダーを環境名 (dev/prd) に置換。以降の差分比較・デプロイは置換済みの内容で行われる
      - name: Render __ENV__ placeholder
        run: sed -i "s/__ENV__/${NAME}/g" "${DOC_DIR}"/*.${DOC_EXT}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ASSUME_ROLE_ARN_CICD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment plan
        id: build_plan
        env:
          TARGETS_JSON: ${{ needs.validate.outputs.targets_json }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          # PR タイトルはユーザー入力のため、式展開ではなく環境変数経由で渡す
          PR_TITLE: ${{ needs.validate.outputs.pr_title }}
          PR_AUTHOR: ${{ needs.validate.outputs.pr_author }}
          CHANGED_COUNT: ${{ needs.validate.outputs.changed_count }}
        run: |
          set -euo pipefail

          # 承認前に確認できるよう、反映予定を plan ファイルと summary にまとめる
          mkdir -p plan
          : > plan/plan.tsv

          {
            echo "# [\`dev\`] SSM Deploy Plan"
            echo ""
            echo "PR #${PR_NUMBER} ${PR_TITLE} (@${PR_AUTHOR})"
            echo ""
            echo "Branch: \`${{ github.ref_name }}\` / Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Changed documents in this PR: \`${CHANGED_COUNT}\`"
            echo ""
            echo "| Action | Document | File | Note |"
            echo "| --- | --- | --- | --- |"
          } > plan/summary.md

          actionable_count=0

          while IFS=$'\t' read -r f name; do
            [ -n "$f" ] || continue

            action="skip"

            # リポジトリから削除されたドキュメントは自動削除せず、
            # SSM 上に残ることを承認者に伝えるため summary に出す
            if [ ! -f "$f" ]; then
              echo "| deleted | \`$name\` | \`$f\` | :warning: SSM 上には残ります。不要なら手動削除してください |" >> plan/summary.md
              continue
            fi

            # ローカル JSON と AWS 上のドキュメント内容を正規化して差分を判定する
            local_norm="$(jq -S -c . "$f")"

            # 権限不足やスロットリングを「存在しない」と誤判定しないよう、
            # InvalidDocument のときだけ create とし、それ以外のエラーは停止する
            if err="$(aws ssm describe-document --name "$name" 2>&1 >/dev/null)"; then
              aws_raw="$(aws ssm get-document --name "$name" --document-version '$LATEST' --query 'Content' --output text)"
              aws_norm="$(printf '%s' "$aws_raw" | jq -S -c .)"
              if [ "$local_norm" != "$aws_norm" ]; then
                action="update"
              fi
            elif printf '%s' "$err" | grep -q 'InvalidDocument'; then
              action="create"
            else
              echo "Failed to describe document '$name': $err" >&2
              exit 1
            fi

            if [ "$action" = "create" ] || [ "$action" = "update" ]; then
              actionable_count=$((actionable_count + 1))
              echo "| $action | \`$name\` | \`$f\` | |" >> plan/summary.md
            fi

            printf '%s\t%s\t%s\n' "$action" "$name" "$f" >> plan/plan.tsv
          done < <(printf '%s' "$TARGETS_JSON" | jq -r '.[] | "\(.file)\t\(.name)"')

          {
            echo ""
            echo "Actionable documents: \`$actionable_count\`"
            echo ""
            echo "Target environment: \`dev\`"
            echo ""
            echo "Review this plan artifact before approving the deployment environment."
          } >> plan/summary.md

          cat plan/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "actionable_count=$actionable_count" >> "$GITHUB_OUTPUT"

      - name: Upload deployment plan
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: plan
          if-no-files-found: error
          retention-days: 7

  # 承認ゲートの後段。plan.tsv に書かれたとおりに反映するだけで、
  # 何を反映するかの判断はしない (判断は plan ジョブが済ませている)。
  deploy-dev:
    # 反映対象が無いときは承認を求めない
    if: ${{ needs.plan.outputs.actionable_count != '0' }}
    needs: [validate, plan]
    runs-on: ubuntu-latest
    environment:
      # Required reviewers を設定済み。ここでジョブが停止し、承認されるまで進まない
      name: Development
    steps:
      # plan ジョブと同じコミットを見る必要がある (理由は plan 側のコメントを参照)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Render __ENV__ placeholder
        run: sed -i "s/__ENV__/${NAME}/g" "${DOC_DIR}"/*.${DOC_EXT}

      - name: Download deployment plan
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: plan

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ASSUME_ROLE_ARN_CICD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy approved documents
        run: |
          set -euo pipefail

          # デプロイ結果を Step Summary に出す。plan summary は deploy 実行前に
          # 生成されるため、フォールバックなど deploy 時に起きたことは書き込めない。
          # 途中で失敗しても、そこまでの結果が残るよう trap で出力する。
          RESULT_ROWS="$RUNNER_TEMP/deploy-result.md"
          : > "$RESULT_ROWS"

          add_row() {
            printf '| `%s` | %s | %s | %s |\n' "$1" "$2" "$3" "$4" >> "$RESULT_ROWS"
          }

          write_summary() {
            [ -s "$RESULT_ROWS" ] || return 0
            {
              echo ""
              echo "## Deploy Result"
              echo ""
              echo "| Document | Result | Version | Note |"
              echo "| --- | --- | --- | --- |"
              cat "$RESULT_ROWS"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap write_summary EXIT

          # ドキュメントを更新し、今回作成したバージョンをデフォルトへ昇格させる。
          # describe-document で最新版を取り直すと、並走する run が間に
          # update-document した場合に他 run のバージョンを昇格させてしまうため、
          # update-document のレスポンスから自分が作ったバージョンを受け取る。
          apply_update() {
            local name="$1" file_path="$2" note="$3"
            local new_ver

            if ! new_ver="$(aws ssm update-document \
              --name "$name" \
              --content "file://$file_path" \
              --document-format JSON \
              --document-version '$LATEST' \
              --query 'DocumentDescription.DocumentVersion' \
              --output text 2>&1)"; then

              # 並走する run が既に同じ内容を反映済み。望む状態になっているので成功扱いとする
              if printf '%s' "$new_ver" | grep -q 'DuplicateDocumentContent'; then
                echo "NOTE: $name already has this content (applied by a concurrent run). Skipping."
                add_row "$name" "skipped" "-" ":information_source: 並走した run が既に同じ内容を反映済み"
                return 0
              fi

              echo "Failed to update document '$name': $new_ver" >&2
              add_row "$name" ":x: failed" "-" "update に失敗しました。ジョブログを確認してください"
              return 1
            fi

            aws ssm update-document-default-version \
              --name "$name" \
              --document-version "$new_ver" > /dev/null

            add_row "$name" "updated" "$new_ver" "$note"
          }

          # plan に従って create/update を実行し、skip は省略する
          while IFS=$'\t' read -r action name file_path; do
            [ -n "$action" ] || continue
            case "$action" in
              create)
                echo "Creating document: $name from $file_path"
                if ! out="$(aws ssm create-document \
                  --name "$name" \
                  --content "file://$file_path" \
                  --document-type "Command" \
                  --document-format JSON \
                  --query 'DocumentDescription.DocumentVersion' \
                  --output text 2>&1)"; then

                  # 並走する run が先に作成済み。update すれば同じ目的を達成できる
                  if printf '%s' "$out" | grep -q 'DocumentAlreadyExists'; then
                    echo "NOTE: $name was created by a concurrent run. Falling back to update."
                    apply_update "$name" "$file_path" \
                      ":information_source: 並走した run が先に作成したため create から update へフォールバック"
                  else
                    echo "Failed to create document '$name': $out" >&2
                    add_row "$name" ":x: failed" "-" "create に失敗しました。ジョブログを確認してください"
                    exit 1
                  fi
                else
                  add_row "$name" "created" "$out" ""
                fi
                ;;
              update)
                echo "Updating document: $name from $file_path"
                apply_update "$name" "$file_path" ""
                ;;
              skip)
                echo "Skipping unchanged document: $name"
                add_row "$name" "skipped" "-" "差分なし"
                ;;
              *)
                echo "Unknown action '$action' for $name" >&2
                exit 1
                ;;
            esac
          done < plan/plan.tsv
