name: dev-ssm-deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: read

# deploy-dev は承認待ちで停止するため、その間に別の run が deploy へ到達しうる。
# update-document → update-document-default-version の間に割り込まれると
# 意図しないバージョンがデフォルトへ昇格するので、直列化する。
concurrency:
  group: dev-ssm-deploy
  cancel-in-progress: false

env:
  NAME: dev
  AWS_REGION: ap-northeast-1
  DOC_DIR: command_documents/healthcheck
  PLAN_ARTIFACT_NAME: ssm-deploy-plan
  # JavaScript製 action を Node.js 24 で実行させるための環境変数
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      changed_count: ${{ steps.changed_files.outputs.changed_count }}
      changed_files_json: ${{ steps.changed_files.outputs.changed_files_json }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_title: ${{ steps.pr.outputs.pr_title }}
      pr_author: ${{ steps.pr.outputs.pr_author }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # PR 番号の打ち間違いを防ぐため、実行時に選択したブランチから
          # base=dev の open PR を逆引きして対象を特定する
          prs="$(gh pr list --head "$BRANCH" --base dev --state open \
            --json number,title,author,isDraft,headRefOid)"
          count="$(printf '%s' "$prs" | jq 'length')"

          if [ "$count" -eq 0 ]; then
            echo "Branch '${BRANCH}' has no open pull request based on 'dev'." >&2
            echo "Select the branch of an open PR targeting 'dev' in 'Use workflow from'." >&2
            exit 1
          fi

          if [ "$count" -gt 1 ]; then
            echo "Branch '${BRANCH}' has multiple open pull requests based on 'dev':" >&2
            printf '%s' "$prs" | jq -r '.[] | "  #\(.number) \(.title)"' >&2
            echo "Cannot determine the deployment target." >&2
            exit 1
          fi

          pr_number="$(printf '%s' "$prs" | jq -r '.[0].number')"
          pr_title="$(printf '%s' "$prs" | jq -r '.[0].title')"
          pr_author="$(printf '%s' "$prs" | jq -r '.[0].author.login')"
          is_draft="$(printf '%s' "$prs" | jq -r '.[0].isDraft')"
          head_oid="$(printf '%s' "$prs" | jq -r '.[0].headRefOid')"

          # 作業途中の PR は反映しない
          if [ "$is_draft" = "true" ]; then
            echo "PR #${pr_number} is a draft. Mark it ready for review before deploying." >&2
            exit 1
          fi

          # 実行開始後に push された場合など、認識と実体がズレた状態でのデプロイを防ぐ
          if [ "$head_oid" != "$RUN_SHA" ]; then
            echo "PR #${pr_number} head (${head_oid}) does not match the checked out commit (${RUN_SHA})." >&2
            echo "The branch was probably updated after this run started. Re-run the workflow." >&2
            exit 1
          fi

          echo "PR #${pr_number} ${pr_title} (@${pr_author})"
          echo "Branch: ${BRANCH}  Commit: ${RUN_SHA}"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_title=$pr_title" >> "$GITHUB_OUTPUT"
          echo "pr_author=$pr_author" >> "$GITHUB_OUTPUT"

      - name: UTF-8 check
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 管理対象の JSON が UTF-8 として読めることを確認する
          for f in "${DOC_DIR}"/*.json; do
            iconv -f UTF-8 -t UTF-8 "$f" > /dev/null
          done

      - name: JSON parse check
        run: |
          set -euo pipefail
          shopt -s nullglob
          # すべての JSON が構文的に正しいことを確認する
          for f in "${DOC_DIR}"/*.json; do
            jq -e . "$f" > /dev/null
          done

      - name: Collect changed documents
        id: changed_files
        run: |
          set -euo pipefail
          # base ブランチが PR 作成後に進んでいても無関係な差分を拾わないよう merge-base を基準にする
          base_sha="$(git merge-base origin/dev HEAD)"

          mapfile -t changed_files < <(
            git diff --name-only "$base_sha" HEAD -- "${DOC_DIR}/*.json"
          )

          changed_json="$(printf '%s\n' "${changed_files[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          echo "changed_count=${#changed_files[@]}" >> "$GITHUB_OUTPUT"
          echo "changed_files_json=$changed_json" >> "$GITHUB_OUTPUT"

  plan:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: Development_ReadOnly
    outputs:
      actionable_count: ${{ steps.build_plan.outputs.actionable_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # __ENV__ プレースホルダーを環境名 (dev/prd) に置換。以降の差分比較・デプロイは置換済みの内容で行われる
      - name: Render __ENV__ placeholder
        run: sed -i "s/__ENV__/${NAME}/g" "${DOC_DIR}"/*.json

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ASSUME_ROLE_ARN_CICD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment plan
        id: build_plan
        env:
          CHANGED_FILES_JSON: ${{ needs.validate.outputs.changed_files_json }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          # PR タイトルはユーザー入力のため、式展開ではなく環境変数経由で渡す
          PR_TITLE: ${{ needs.validate.outputs.pr_title }}
          PR_AUTHOR: ${{ needs.validate.outputs.pr_author }}
          CHANGED_COUNT: ${{ needs.validate.outputs.changed_count }}
        run: |
          set -euo pipefail

          # 承認前に確認できるよう、反映予定を plan ファイルと summary にまとめる
          mkdir -p plan
          : > plan/plan.tsv

          {
            echo "# [\`dev\`] SSM Deploy Plan"
            echo ""
            echo "PR #${PR_NUMBER} ${PR_TITLE} (@${PR_AUTHOR})"
            echo ""
            echo "Branch: \`${{ github.ref_name }}\` / Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Changed documents in this PR: \`${CHANGED_COUNT}\`"
            echo ""
            echo "| Action | Document | File | Note |"
            echo "| --- | --- | --- | --- |"
          } > plan/summary.md

          actionable_count=0

          while IFS= read -r f; do
            [ -n "$f" ] || continue

            # ファイル名抽出
            base="$(basename "$f")"
            # ***.sh.jsonから***.shを切り出して先頭に環境名を付与
            name="${{ env.NAME }}-${base%.*}"
            action="skip"

            # リポジトリから削除されたドキュメントは自動削除せず、
            # SSM 上に残ることを承認者に伝えるため summary に出す
            if [ ! -f "$f" ]; then
              echo "| deleted | \`$name\` | \`$f\` | :warning: SSM 上には残ります。不要なら手動削除してください |" >> plan/summary.md
              continue
            fi

            # ローカル JSON と AWS 上のドキュメント内容を正規化して差分を判定する
            local_norm="$(jq -S -c . "$f")"

            # 権限不足やスロットリングを「存在しない」と誤判定しないよう、
            # InvalidDocument のときだけ create とし、それ以外のエラーは停止する
            if err="$(aws ssm describe-document --name "$name" 2>&1 >/dev/null)"; then
              aws_raw="$(aws ssm get-document --name "$name" --document-version '$LATEST' --query 'Content' --output text)"
              aws_norm="$(printf '%s' "$aws_raw" | jq -S -c .)"
              if [ "$local_norm" != "$aws_norm" ]; then
                action="update"
              fi
            elif printf '%s' "$err" | grep -q 'InvalidDocument'; then
              action="create"
            else
              echo "Failed to describe document '$name': $err" >&2
              exit 1
            fi

            if [ "$action" = "create" ] || [ "$action" = "update" ]; then
              actionable_count=$((actionable_count + 1))
              echo "| $action | \`$name\` | \`$f\` | |" >> plan/summary.md
            fi

            printf '%s\t%s\t%s\n' "$action" "$name" "$f" >> plan/plan.tsv
          done < <(printf '%s' "$CHANGED_FILES_JSON" | jq -r '.[]')

          {
            echo ""
            echo "Actionable documents: \`$actionable_count\`"
            echo ""
            echo "Target environment: \`dev\`"
            echo ""
            echo "Review this plan artifact before approving the deployment environment."
          } >> plan/summary.md

          cat plan/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "actionable_count=$actionable_count" >> "$GITHUB_OUTPUT"

      - name: Upload deployment plan
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: plan
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    if: ${{ needs.plan.outputs.actionable_count != '0' }}
    needs: [validate, plan]
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Render __ENV__ placeholder
        run: sed -i "s/__ENV__/${NAME}/g" "${DOC_DIR}"/*.json

      - name: Download deployment plan
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: plan

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ASSUME_ROLE_ARN_CICD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy approved documents
        run: |
          set -euo pipefail

          # plan に従って create/update を実行し、skip は省略する
          while IFS=$'\t' read -r action name file_path; do
            [ -n "$action" ] || continue
            case "$action" in
              create)
                echo "Creating document: $name from $file_path"
                aws ssm create-document \
                  --name "$name" \
                  --content "file://$file_path" \
                  --document-type "Command" \
                  --document-format JSON
                ;;
              update)
                echo "Updating document: $name from $file_path"
                aws ssm update-document \
                  --name "$name" \
                  --content "file://$file_path" \
                  --document-format JSON \
                  --document-version '$LATEST'

                # 更新直後の最新版をデフォルト版へ切り替える
                latest_ver="$(aws ssm describe-document \
                  --name "$name" \
                  --query 'Document.LatestVersion' \
                  --output text)"

                aws ssm update-document-default-version \
                  --name "$name" \
                  --document-version "$latest_ver"
                ;;
              skip)
                echo "Skipping unchanged document: $name"
                ;;
              *)
                echo "Unknown action '$action' for $name" >&2
                exit 1
                ;;
            esac
          done < plan/plan.tsv
