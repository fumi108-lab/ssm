name: dev-ssm-deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "デプロイ対象の Pull Request 番号 (base: dev)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  NAME: dev
  AWS_REGION: ap-northeast-1
  DOC_DIR: command_documents/healthcheck
  PLAN_ARTIFACT_NAME: ssm-deploy-plan
  # JavaScript製 action を Node.js 24 で実行させるための環境変数
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      changed_count: ${{ steps.changed_files.outputs.changed_count }}
      changed_files_json: ${{ steps.changed_files.outputs.changed_files_json }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          # 手動実行では PR イベントが無いため、入力された PR 番号からメタ情報を取得する
          pr_json="$(gh pr view "$PR_NUMBER" --json baseRefName,baseRefOid,headRefOid,state)"

          base_ref="$(printf '%s' "$pr_json" | jq -r '.baseRefName')"
          base_oid="$(printf '%s' "$pr_json" | jq -r '.baseRefOid')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          state="$(printf '%s' "$pr_json" | jq -r '.state')"

          # main 向け PR を誤って dev 環境へ反映しないためのガード
          if [ "$base_ref" != "dev" ]; then
            echo "PR #${PR_NUMBER} targets '${base_ref}', but this workflow only deploys PRs based on 'dev'." >&2
            exit 1
          fi

          echo "PR #${PR_NUMBER} (state: ${state}) base=${base_ref} head=${head_sha}"

          echo "base_oid=$base_oid" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request head
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # チェック・デプロイ対象は PR の head の内容
          git fetch origin "pull/${PR_NUMBER}/head"
          git checkout --detach "$HEAD_SHA"

      - name: UTF-8 check
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 管理対象の JSON が UTF-8 として読めることを確認する
          for f in "${DOC_DIR}"/*.json; do
            iconv -f UTF-8 -t UTF-8 "$f" > /dev/null
          done

      - name: JSON parse check
        run: |
          set -euo pipefail
          shopt -s nullglob
          # すべての JSON が構文的に正しいことを確認する
          for f in "${DOC_DIR}"/*.json; do
            jq -e . "$f" > /dev/null
          done

      - name: Collect changed documents
        id: changed_files
        env:
          BASE_OID: ${{ steps.pr.outputs.base_oid }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # base ブランチが PR 作成後に進んでいても無関係な差分を拾わないよう merge-base を基準にする
          base_sha="$(git merge-base "$BASE_OID" "$HEAD_SHA")"

          mapfile -t changed_files < <(
            git diff --name-only "$base_sha" "$HEAD_SHA" -- "${DOC_DIR}/*.json"
          )

          changed_json="$(printf '%s\n' "${changed_files[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          echo "changed_count=${#changed_files[@]}" >> "$GITHUB_OUTPUT"
          echo "changed_files_json=$changed_json" >> "$GITHUB_OUTPUT"

  plan:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: Development_ReadOnly
    outputs:
      actionable_count: ${{ steps.build_plan.outputs.actionable_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.head_sha }}

      # __ENV__ プレースホルダーを環境名 (dev/prd) に置換。以降の差分比較・デプロイは置換済みの内容で行われる
      - name: Render __ENV__ placeholder
        run: sed -i "s/__ENV__/${NAME}/g" "${DOC_DIR}"/*.json

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ASSUME_ROLE_ARN_CICD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment plan
        id: build_plan
        env:
          CHANGED_FILES_JSON: ${{ needs.validate.outputs.changed_files_json }}
        run: |
          set -euo pipefail

          # 承認前に確認できるよう、反映予定を plan ファイルと summary にまとめる
          mkdir -p plan
          : > plan/plan.tsv

          {
            echo "# [\`dev\`] SSM Deploy Plan (PR #${{ inputs.pr_number }})"
            echo ""
            echo "| Action | Document | File |"
            echo "| --- | --- | --- |"
          } > plan/summary.md

          actionable_count=0

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              continue
            fi

            # ファイル名抽出
            base="$(basename "$f")"
            # ***.sh.jsonから***.shを切り出して先頭に環境名を付与
            name="${{ env.NAME }}-${base%.*}"
            action="skip"

            # ローカル JSON と AWS 上のドキュメント内容を正規化して差分を判定する
            local_norm="$(jq -S -c . "$f")"

            if aws ssm describe-document --name "$name" >/dev/null 2>&1; then
              aws_raw="$(aws ssm get-document --name "$name" --document-version '$LATEST' --query 'Content' --output text)"
              aws_norm="$(printf '%s' "$aws_raw" | jq -S -c .)"
              if [ "$local_norm" != "$aws_norm" ]; then
                action="update"
              fi
            else
              action="create"
            fi

            if [ "$action" = "create" ] || [ "$action" = "update" ]; then
              actionable_count=$((actionable_count + 1))
              echo "| $action | \`$name\` | \`$f\` |" >> plan/summary.md
            fi

            printf '%s\t%s\t%s\n' "$action" "$name" "$f" >> plan/plan.tsv
          done < <(printf '%s' "$CHANGED_FILES_JSON" | jq -r '.[]')

          {
            echo ""
            echo "Actionable documents: \`$actionable_count\`"
            echo ""
            echo "Target environment: \`dev\`"
            echo ""
            echo "Review this plan artifact before approving the deployment environment."
          } >> plan/summary.md

          cat plan/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "actionable_count=$actionable_count" >> "$GITHUB_OUTPUT"

      - name: Upload deployment plan
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: plan
          if-no-files-found: error

  deploy-dev:
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.actionable_count != '0' }}
    needs: [validate, plan]
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.head_sha }}

      - name: Render __ENV__ placeholder
        run: sed -i "s/__ENV__/${NAME}/g" "${DOC_DIR}"/*.json

      - name: Download deployment plan
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: plan

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ASSUME_ROLE_ARN_CICD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy approved documents
        run: |
          set -euo pipefail

          # plan に従って create/update を実行し、skip は省略する
          while IFS=$'\t' read -r action name file_path; do
            [ -n "$action" ] || continue
            case "$action" in
              create)
                echo "Creating document: $name from $file_path"
                aws ssm create-document \
                  --name "$name" \
                  --content "file://$file_path" \
                  --document-type "Command" \
                  --document-format JSON
                ;;
              update)
                echo "Updating document: $name from $file_path"
                aws ssm update-document \
                  --name "$name" \
                  --content "file://$file_path" \
                  --document-format JSON \
                  --document-version '$LATEST'

                # 更新直後の最新版をデフォルト版へ切り替える
                latest_ver="$(aws ssm describe-document \
                  --name "$name" \
                  --query 'Document.LatestVersion' \
                  --output text)"

                aws ssm update-document-default-version \
                  --name "$name" \
                  --document-version "$latest_ver"
                ;;
              skip)
                echo "Skipping unchanged document: $name"
                ;;
              *)
                echo "Unknown action '$action' for $name" >&2
                exit 1
                ;;
            esac
          done < plan/plan.tsv
