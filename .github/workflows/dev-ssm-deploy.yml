name: dev-ssm-deploy

# command_documents/healthcheck/*.json を dev 環境の SSM Command ドキュメントへ反映する。
#
# 処理の実体は .github/workflows/ssm-deploy.yml (再利用可能ワークフロー) にある。
# ここは実行方法と環境固有の値だけを定義する薄いラッパー。
# 仕様・設計判断は ssm-deploy.yml の冒頭コメントと README を参照。
#
# 実行方法:
#   Actions の Run workflow で「Use workflow from」に対象ブランチを選ぶ。入力欄は無い。
#   選んだブランチに紐づく base=dev の open PR を逆引きし、その差分だけを反映する。

on:
  workflow_dispatch:

# permissions は呼び出し側で宣言する。呼び出し側の設定が ssm-deploy.yml にも適用され、
# 再利用側では制限しかできないため。
permissions:
  id-token: write # OIDC で IAM Role を AssumeRole するために必要
  contents: read
  pull-requests: read # 対象 PR の逆引き (gh pr list) に必要。外すと動かない

# 複数人が別々のドキュメントを同時に編集する運用を想定し、ブランチ (= PR) 単位で
# 並走させる。同一ブランチの重複実行だけを直列化して二重反映を防ぐ。
# 同じドキュメントが競合した場合は後にデプロイされた内容が有効になる (後勝ち)。
concurrency:
  group: dev-ssm-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ジョブ ID は Actions 画面で "<ここ> / validate" のように再利用側のジョブ名の前に出る。
  # 環境名にしておくと、他のデプロイワークフローと並んだときに見分けやすい。
  dev:
    uses: ./.github/workflows/ssm-deploy.yml
    # environment スコープの vars と GITHUB_TOKEN を再利用側へ引き継ぐ
    secrets: inherit
    with:
      env_name: dev
      doc_dir: command_documents/healthcheck
      doc_ext: json
      # SSM ドキュメント名は <env_name>-<doc_type>-<任意> になる。
      # IAM ポリシーの Resource が document/dev-cmd-* に限定されているため、
      # doc_type を変更する場合は IAM 側の Resource も合わせて変更すること。
      doc_type: cmd
      base_branches: "dev"
      ssm_document_type: Command
      ssm_document_format: JSON
      plan_artifact_name: ssm-deploy-plan
      plan_title: SSM Deploy Plan
      environment_plan: Development_ReadOnly
      environment_deploy: Development
